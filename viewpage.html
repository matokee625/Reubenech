<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN TO REUBENTECH MILK SOLUTIONS</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <!-- Back to Homepage -->
    <a href="index.html" class="btn-home">← Back to Homepage</a>

    <!-- Glassmorphic Login Card -->
    <div class="login-card">
        <!-- Mockup Title Bar -->
        <div class="login-header-bar">
            LOGIN TO REUBENTECH MILK SOLUTIONS
        </div>

        <div class="login-body">
            <!-- Profile Silhouette Avatar -->
            <div class="avatar-circle">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
                </svg>
            </div>

            <!-- Login Form -->
            <form method="POST" action="#" style="width: 100%;">
                <!-- Username Input -->
                <div class="input-container">
                    <span class="input-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </span>
                    <input type="text" id="email" name="email" placeholder="Username" autocomplete="username" required>
                </div>

                <!-- Password Input -->
                <div class="input-container">
                    <span class="input-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </span>
                    <input type="password" id="password" name="password" placeholder="************"
                        autocomplete="current-password" required>
                    <span class="toggle-password" onclick="togglePassword()">Show</span>
                </div>

                <!-- Remember & Forgot Password -->
                <div class="extras-row">
                    <label class="remember-me">
                        <input type="checkbox" name="remember"> Remember me
                    </label>
                    <a href="#" class="forgot-link">Forgot Password?</a>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-login">LOGIN</button>
            </form>

            <!-- Bottom Links -->
            <div class="bottom-links">
                Don't have an account? <a href="register.html">Sign up</a>
            </div>
        </div>
    </div>

    <script>
        function togglePassword() {
            var passwordField = document.getElementById("password");
            var toggleText = document.querySelector(".toggle-password");
            if (passwordField.type === "password") {
                passwordField.type = "text";
                toggleText.textContent = "Hide";
            } else {
                passwordField.type = "password";
                toggleText.textContent = "Show";
            }
        }
    </script>
</body>
</html>
