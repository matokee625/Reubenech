<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="css/login.css">
    <!-- Load Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
    <style>
        /* Extracted inline styles for login layout */
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #6b11cb 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            width: 100%;
            max-width: 450px;
            overflow: hidden;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }
        .login-header-bar {
            background: linear-gradient(90deg, #3b5998 0%, #4c70ba 100%);
            color: white;
            text-align: center;
            padding: 1.5rem 1rem;
            font-weight: bold;
        }
        .login-body {
            padding: 2rem;
        }
        .input-container input {
            width: 100%;
            padding: 0.9rem;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.3);
            margin-bottom: 1rem;
            box-sizing: border-box;
        }
        .btn-login {
            width: 100%;
            padding: 0.9rem;
            background: #3b5998;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .success-box, .error-box {
            padding: 1rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            display: none;
            text-align: center;
        }
        .success-box { background: rgba(16,185,129,0.2); color: #a7f3d0; border: 1px solid rgba(16,185,129,0.4); }
        .error-box { background: rgba(239,68,68,0.2); color: #fca5a5; border: 1px solid rgba(239,68,68,0.4); }
        .bottom-links { text-align: center; margin-top: 1rem; }
        .bottom-links a { color: white; text-decoration: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header-bar">Reset Your Password</div>
        <div class="login-body">
            <div id="error-box" class="error-box"></div>
            <div id="success-box" class="success-box"></div>
            
            <form id="forgot-form">
                <div class="input-container">
                    <input type="email" id="email" placeholder="Email Address" required>
                </div>
                <button type="submit" id="submit-btn" class="btn-login">Send Reset Link</button>
            </form>
            <div class="bottom-links"><a href="login.html">Back to login</a></div>
        </div>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const form = document.getElementById('forgot-form');
            const errorBox = document.getElementById('error-box');
            const successBox = document.getElementById('success-box');
            const submitBtn = document.getElementById('submit-btn');

            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                errorBox.style.display = 'none';
                successBox.style.display = 'none';
                submitBtn.disabled = true;
                submitBtn.textContent = 'Sending...';

                const email = document.getElementById('email').value;

                const { error } = await supabase.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin + '/milkproject/reset_password.html',
                });

                if (error) {
                    errorBox.textContent = error.message;
                    errorBox.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Send Reset Link';
                } else {
                    successBox.textContent = 'A reset link has been sent to your email address.';
                    successBox.style.display = 'block';
                    form.reset();
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Send Reset Link';
                }
            });
        });
    </script>
</body>
</html>
