<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <script>
<!-- Supabase login will be handled via JS; remove local redirect -->
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN TO REUBENTECH MILK SOLUTIONS</title>
    <link rel="icon" href="favicon.php" type="image/x-icon">
    <link rel="stylesheet" href="css/login.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://hcnnimmosapaiwvthvta.supabase.co';
        const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhjbm5pbW1vc2FwYWl3dnRodnRhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwNzcxMDAsImV4cCI6MjA5ODY1MzEwMH0.BFVr1JKiQPxoOcEJryFItBJ89WxbeCmtCWBAKwv8cjg';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseAnonKey);

        // Handle local file protocol (file://) redirection to prevent downloads
        document.addEventListener("DOMContentLoaded", function () {
            var isFile = window.location.protocol === 'file:';
            var isLiveServer = window.location.port !== '' && window.location.port !== '80' && window.location.port !== '443';

            if (isFile || isLiveServer) {
                // Rewrite Links to open through Apache local server
                document.querySelectorAll("a").forEach(function (link) {
                    var href = link.getAttribute("href");
                    if (href && !href.startsWith("http://") && !href.startsWith("https://") && !href.startsWith("#") && !href.startsWith("javascript:")) {
                        if (href.indexOf(".php") !== -1 || href === "signin.html") {
                            var target = href;
                            if (href.startsWith("../")) {
                                target = href.substring(3);
                            }
                            link.setAttribute("href", "http://localhost/milkproject/" + target);
                        }
                    }
                });
            }

            const loginForm = document.getElementById('login-form');
            if (loginForm) {
                loginForm.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    
                    const email = document.getElementById('email').value;
                    const password = document.getElementById('password').value;
                    const errorBox = document.getElementById('error-box');
                    const successBox = document.getElementById('success-box');
                    
                    if (errorBox) errorBox.style.display = 'none';
                    if (successBox) successBox.style.display = 'none';
                    
                    const submitBtn = loginForm.querySelector('button[type="submit"]');
                    submitBtn.disabled = true;
                    submitBtn.textContent = 'LOGGING IN...';
                    
                    const { data, error } = await supabaseClient.auth.signInWithPassword({
                        email: email,
                        password: password,
                    });
                    
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'LOGIN';
                    
                    if (error) {
                        if (errorBox) {
                            errorBox.textContent = error.message;
                            errorBox.style.display = 'block';
                        } else {
                            alert(error.message);
                        }
                    } else {
                        if (successBox) {
                            successBox.textContent = 'Login successful! Redirecting...';
                            successBox.style.display = 'block';
                        } else {
                            alert('Login successful! Redirecting...');
                        }
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 1000);
                    }
                });
            }
        });
    </script>
</head>

<body>

    <!-- Back to Homepage -->
    <a href="index.html" class="btn-home">← Back to Homepage</a>

    <!-- Glassmorphic Login Card -->
    <div class="login-card">
        <!-- Mockup Title Bar -->
        <div class="login-header-bar">
            LOGIN TO REUBENTECH MILK SOLUTIONS
        </div>

        <div class="login-body">
            <!-- Profile Silhouette Avatar -->
            <div class="avatar-circle">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
                </svg>
            </div>

            <!-- Notifications -->
            <div id="error-box" style="display:none; width: 100%; background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; padding: 0.75rem 1rem; border-radius: 6px; margin-bottom: 1.25rem; font-size: 0.875rem; text-align: center;"></div>
            <div id="success-box" style="display:none; width: 100%; background: rgba(16, 185, 129, 0.2); border: 1px solid rgba(16, 185, 129, 0.4); color: #a7f3d0; padding: 0.75rem 1rem; border-radius: 6px; margin-bottom: 1.25rem; font-size: 0.875rem; text-align: center;"></div>

            <!-- Login Form -->
            <form id="login-form" style="width: 100%;">
                <!-- Username Input (accepts username or email on backend) -->
                <div class="input-container">
                    <span class="input-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </span>
                    <input type="email" id="email" name="email" placeholder="Email Address" autocomplete="email" required>
                </div>

                <!-- Password Input -->
                <div class="input-container">
                    <span class="input-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </span>
                    <input type="password" id="password" name="password" placeholder="************"
                        autocomplete="current-password" required>
                    <span class="toggle-password" onclick="togglePassword()">Show</span>
                </div>

                <!-- Remember & Forgot Password -->
                <div class="extras-row">
                    <label class="remember-me">
                        <input type="checkbox" name="remember"> Remember me
                    </label>
                    <a href="#" class="forgot-link">Forgot Password?</a>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-login">LOGIN</button>
            </form>

            <!-- Bottom Links -->
            <div class="bottom-links">
                Don't have an account? <a href="register.html">Sign up</a>
            </div>
        </div>
    </div>

    <script>
        function togglePassword() {
            var passwordField = document.getElementById("password");
            var toggleText = document.querySelector(".toggle-password");
            if (passwordField.type === "password") {
                passwordField.type = "text";
                toggleText.textContent = "Hide";
            } else {
                passwordField.type = "password";
                toggleText.textContent = "Show";
            }
        }
    </script>
</body>

</html>
