<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REUBENTECH Admin Dashboard</title>
    <link rel="stylesheet" href="css/login.css">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 60%, #6b11cb 100%); }
        .admin-card { background: rgba(255,255,255,0.12); backdrop-filter: blur(12px) saturate(120%); -webkit-backdrop-filter: blur(12px) saturate(120%); border: 1px solid rgba(255,255,255,0.2); border-radius: 16px; padding: 2rem; max-width: 900px; margin: 4rem auto; color: var(--color-text); box-shadow: 0 8px 32px rgba(31,38,135,0.37); }
        .admin-card h1 {font-family: var(--font-heading); font-size:2.5rem; margin-bottom:1rem; color:#fff;}
        .admin-card button {background:var(--color-primary); color:#fff; border:none; padding:0.5rem 1rem; border-radius:var(--radius-md); cursor:pointer; margin-top:1rem; }
        .admin-card button:hover {background:var(--color-primary-hover);}
        .admin-card table {width:100%; border-collapse:collapse; margin-top:1.5rem;}
        .admin-card th, .admin-card td {padding:0.75rem 1rem; text-align:left; border-bottom:1px solid rgba(255,255,255,0.2);}        
        .admin-card th {background:rgba(255,255,255,0.1);}
        .admin-card a.btn {display:inline-block; margin-top:1.5rem; padding:0.75rem 1.5rem; background:var(--color-primary); color:#fff; border-radius:var(--radius-md); text-decoration:none; font-weight:600;}
    </style>
</head>
<body>
    <div class="admin-card">
        <h1>Welcome, REUBENTECH</h1>
        <p>This dashboard lets you view all registered users and approve pending accounts securely.</p>
<p>Username: REUBENTECH</p>
<p>Password: password</p>
        <button id="load-users">Load Users</button>
        <div id="users-container"></div>
        <a href="index.html" class="btn">Return to Home</a>
    </div>
    <script>
        <!-- Supabase integration removed -->
        // Load users from server‑side PHP proxy
        async function loadUsers(){
            const resp = await fetch('users.json');
            if(!resp.ok){
                document.getElementById('users-container').innerHTML = `<p style="color:#f87171;">Failed to load users (${resp.status})</p>`;
                return;
            }
            const users = await resp.json();
            renderTable(users);
        }
        function renderTable(users){
            if(!users || users.length===0){
                document.getElementById('users-container').innerHTML = '<p>No users found.</p>';return;
            }
            let html = `<table><thead><tr><th>Email</th><th>Status</th><th>Action</th></tr></thead><tbody>`;
            users.forEach(u=>{
                const pending = u.role === 'pending' || u.is_pending;
                html+=`<tr data-id="${u.id}"><td>${u.email||'—'}</td><td>${pending?'Pending':'Active'}</td><td>${pending?'<button class="approve-btn">Approve</button>':''}</td></tr>`;
            });
            html+='</tbody></table>';
            document.getElementById('users-container').innerHTML = html;
            document.querySelectorAll('.approve-btn').forEach(btn=>{
                btn.addEventListener('click', async e=>{
                    const row = e.target.closest('tr');
                    const id = row.dataset.id;
                    const res = await fetch('admin-approve.php',{
                        method:'POST',
                        headers:{'Content-Type':'application/json'},
                        body:JSON.stringify({id})
                    });
                    if(res.ok){
                        alert('User approved');
                        loadUsers();
                    } else {
                        alert('Failed to approve');
                    }
                });
            });
        }
        document.getElementById('load-users').addEventListener('click', loadUsers);
        loadUsers();
    </script>
</body>
</html>
