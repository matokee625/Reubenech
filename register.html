<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Reubentech Milk Solutions</title>
    <link rel="stylesheet" href="css/login.css">
    <style>
        .info-banner {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 1.5rem;
            max-width: 450px;
            width: 100%;
            margin-bottom: 1.5rem;
            text-align: center;
            color: rgba(255,255,255,0.9);
            font-size: 0.9rem;
            line-height: 1.6;
        }
        .info-banner strong { color: #fbbf24; }
    </style>
</head>
<body>

    <!-- Back to Homepage -->
    <a href="index.html" class="btn-home">← Back to Homepage</a>



    <!-- Glassmorphic Registration Card -->
    <div class="login-card">
        <!-- Header Bar -->
        <div class="login-header-bar">
            CREATE YOUR ACCOUNT
        </div>

        <div class="login-body">
            <!-- Profile Avatar -->
            <div class="avatar-circle">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
            </div>

            <!-- Registration Form -->
            <form method="POST" action="register.php" style="width: 100%;">
                <!-- Username -->
                <div class="input-container">
                    <span class="input-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </span>
                    <input type="text" name="username" placeholder="Username" required>
                </div>

                <!-- Email -->
                <div class="input-container">
                    <span class="input-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                    </span>
                    <input type="email" name="email" placeholder="Email Address" required>
                </div>

                <!-- Phone -->
                <div class="input-container">
                    <span class="input-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"></path>
                        </svg>
                    </span>
                    <input type="tel" name="phone" placeholder="Phone Number" required>
                </div>

                <!-- Password -->
                <div class="input-container">
                    <span class="input-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </span>
                    <input type="password" name="password" placeholder="Create Password" required>
                </div>

                <!-- Submit -->
                <button type="submit" class="btn-login">REGISTER</button>
            </form>

            <!-- Bottom Links -->
            <div class="bottom-links">
                Already have an account? <a href="viewpage.html">Sign In</a>
            </div>
        </div>
    </div>

</body>
</html>
