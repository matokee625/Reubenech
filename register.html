    <script>
        const supabaseUrl = 'https://hcnnimmosapaiwvthvta.supabase.co';
        const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhjbm5pbW1vc2FwYWl3dnRodnRhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwNzcxMDAsImV4cCI6MjA5ODY1MzEwMH0.BFVr1JKiQPxoOcEJryFItBJ89WxbeCmtCWBAKwv8cjg';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseAnonKey);

        // Handle local file protocol (file://) redirection to prevent downloads
        document.addEventListener("DOMContentLoaded", function() {
            var isFile = window.location.protocol === 'file:';
            var isLiveServer = window.location.port !== '' && window.location.port !== '80' && window.location.port !== '443';

            if (isFile || isLiveServer) {
                // Rewrite Links to open through Apache local server
                document.querySelectorAll("a").forEach(function(link) {
                    var href = link.getAttribute("href");
                    if (href && !href.startsWith("http://") && !href.startsWith("https://") && !href.startsWith("#") && !href.startsWith("javascript:")) {
                        if (href.indexOf(".php") !== -1 || href === "login\.html" || href === "register.html") {
                            var target = href;
                            if (href.startsWith("../")) {
                                target = href.substring(3);
                            }
                            link.setAttribute("href", "http://localhost/milkproject/" + target);
                        }
                    }
                });
            }

            const registerForm = document.getElementById('register-form');
            if (registerForm) {
                registerForm.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    
                    const username = document.getElementById('username').value;
                    const email = document.getElementById('email').value;
                    const password = document.getElementById('password').value;
                    const confirmPassword = document.getElementById('confirm_password').value;
                    const errorBox = document.getElementById('error-box');
                    const successBox = document.getElementById('success-box');
                    
                    errorBox.style.display = 'none';
                    successBox.style.display = 'none';
                    
                    if (password !== confirmPassword) {
                        errorBox.textContent = 'Passwords do not match.';
                        errorBox.style.display = 'block';
                        return;
                    }
                    
                    if (password.length < 8) {
                        errorBox.textContent = 'Password must be at least 8 characters.';
                        errorBox.style.display = 'block';
                        return;
                    }
                    
                    const submitBtn = registerForm.querySelector('button[type="submit"]');
                    submitBtn.disabled = true;
                    submitBtn.textContent = 'REGISTERING...';
                    
                    const { data, error } = await supabaseClient.auth.signUp({
                        email: email,
                        password: password,
                        options: {
                            data: {
                                username: username
                            }
                        }
                    });
                    
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'REGISTER';
                    
                    if (error) {
                        errorBox.textContent = error.message;
                        errorBox.style.display = 'block';
                    } else {
                        successBox.textContent = 'Registration successful! Awaiting admin approval before you can log in.';
                        successBox.style.display = 'block';
                        registerForm.reset();
                        // No automatic redirect – admin must approve the account.
                        // Optionally you could hide the form or display further instructions.
                        // Keeping the page static for now.
                        submitBtn.disabled = false;
                    }
                });
            }
        });
    </script>

    <script>
        window.togglePassword = function(fieldId) {
            var passwordField = document.getElementById(fieldId);
            var toggleText = passwordField.nextElementSibling;
            if (passwordField.type === "password") {
                passwordField.type = "text";
                toggleText.textContent = "Hide";
            } else {
                passwordField.type = "password";
                toggleText.textContent = "Show";
            }
        };
